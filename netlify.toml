# Unbork: static pages in public/ plus one function (netlify/functions/scan.mjs,
# served at /api/scan by the path in its own config). No build step.

[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/guides/lovable-404-on-refresh"
  to = "/guides/lovable-404-on-refresh.html"
  status = 200

[[redirects]]
  from = "/guides/is-my-supabase-key-safe"
  to = "/guides/is-my-supabase-key-safe.html"
  status = 200

[[redirects]]
  from = "/guides/does-my-app-need-a-cookie-banner"
  to = "/guides/does-my-app-need-a-cookie-banner.html"
  status = 200

[[redirects]]
  from = "/guides/add-a-privacy-policy-to-a-lovable-app"
  to = "/guides/add-a-privacy-policy-to-a-lovable-app.html"
  status = 200

[[redirects]]
  from = "/guides/what-is-row-level-security"
  to = "/guides/what-is-row-level-security.html"
  status = 200

[[redirects]]
  from = "/guides/what-are-security-headers"
  to = "/guides/what-are-security-headers.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/refunds"
  to = "/refunds.html"
  status = 200

# Unbork has to pass its own check. Everything is served from this origin, so
# the content security policy can be strict: no inline script, no third party.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
